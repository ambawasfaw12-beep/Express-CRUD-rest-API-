<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Handler By Express</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <h1>Task Manager</h1>
    </header>

    <main>
        <section>
            <h2>Add Task</h2>
            <form id="taskForm" class="task-adder-form">
                <div class="form-group">
                    <label for="taskInput">Title:</label>
                    <input type="text" name="title" id="taskInput" required>
                </div>

                <div class="form-group">
                    <label for="taskDesc">Description:</label>
                    <textarea name="description" id="taskDesc" rows="3"></textarea>
                </div>
                <button type="submit" id="add-btn">Add Task</button>
            </form>
        </section>

        <section>
            <h2>Your Tasks</h2>
            <ul id="taskList"></ul>
        </section>
    </main>

    <script src="/app.js" defer></script>
</body>

</html>
